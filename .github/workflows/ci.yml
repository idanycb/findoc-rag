name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Verify backend
        working-directory: backend
        run: ./mvnw verify

      - name: Test EDGAR service
        working-directory: edgar-service
        run: uv run pytest
