spring:
  application:
    name: findoc-analyzer

  config:
    import: optional:file:.env[.properties]

  cloud:
    aws:
      sqs:
        listener:
          max-concurrent-messages: 5
          max-messages-per-poll: 5
        queue-not-found-strategy: fail

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: false

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect # Not required but good practice
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  task:
    execution:
      pool:
        core-size: 8
        max-size: 10
        queue-capacity: 25
      thread-name-prefix: ai-worker-

langchain4j:
  open-ai:
    chat-model:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      model-name: llama-3.1-8b-instant
      temperature: 0.0
      timeout: 30s
      log-requests: true
      log-responses: true

logging:
  level:
    org.springframework:web: INFO
    org.springframework.orm.jpa: ERROR
    com.zaxxer.hikari: ERROR
    org.hibernate: ERROR
    com.enterprise: DEBUG
  exception-conversion-word: "%wEx{short}"