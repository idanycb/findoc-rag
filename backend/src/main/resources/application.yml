spring:
  application:
    name: findoc-analyzer

  config:
    import: optional:file:.env[.properties]

  cloud:
    aws:
      sqs:
        listener:
          max-concurrent-messages: 5
          max-messages-per-poll: 5
        queue-not-found-strategy: fail

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect # Not required but good practice
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  task:
    execution:
      pool:
        core-size: 8
        max-size: 10
        queue-capacity: 25
      thread-name-prefix: ai-worker-

langchain4j:
  google-ai-gemini:
    chat-model:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta
      model-name: gemini-2.5-flash-lite
      temperature: 0.7
      timeout: 30s
      max-output-tokens: 4096
      max-retries: 2
      log-requests-and-responses: true

docling:
  url: ${DOCLING_URL:http://localhost:5001}
  timeout: ${DOCLING_TIMEOUT:PT5M}

edgar:
  url: ${EDGAR_SERVICE_URL:http://localhost:8100}

logging:
  level:
    org.springframework:web: INFO
    org.springframework.orm.jpa: ERROR
    com.zaxxer.hikari: ERROR
    org.hibernate: ERROR
    com.enterprise: DEBUG
  exception-conversion-word: "%wEx{short}"