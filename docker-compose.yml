name: Findoc Analyzer

services:
  pgvector:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql

  docling-serve:
    image: quay.io/docling-project/docling-serve-cpu:v1.21.0
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
    deploy:
      resources:
        limits:
          memory: 4G # Local safety cap

  edgar-service:
    build:
      context: ./edgar-service
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - EDGAR_IDENTITY=${EDGAR_IDENTITY:-}
      - EDGAR_LOCAL_DATA_DIR=/tmp/edgar/data
      - EDGAR_CACHE_DIR=/tmp/edgar/cache

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      pgvector:
        condition: service_healthy
      docling-serve:
        condition: service_started
      edgar-service:
        condition: service_started
    env_file:
      - .env
    environment:
      - POSTGRES_URL=jdbc:postgresql://pgvector:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pgvector:5432/${POSTGRES_DB}
      - DOCLING_URL=http://docling-serve:5001
      - EDGAR_SERVICE_URL=http://edgar-service:8100

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_API_DESTINATION=http://backend:8080/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: