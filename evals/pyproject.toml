[project]
name = "findoc-evals"
version = "0.1.0"
description = "Local-only evaluation harness for FinDoc RAG experiments."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
