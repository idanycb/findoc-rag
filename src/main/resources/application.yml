spring:
  application:
    name: findoc-analyzer

  datasource:
    url: jdbc:postgresql://localhost:5432/findoc_analyzer_db
    username: danycb
    password: super_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect # Not required but good practice
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.sql: DEBUG
    com.enterprise: DEBUG
